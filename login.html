<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Sign in · Trip Planner</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trips">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  /* The same look as the app: white page, hairlines, one accent, pill buttons.
     Text colours measured at 4.5:1 or better in both themes. */
  :root{
    color-scheme: light dark;
    --bg:#FFFFFF; --card:#FFFFFF; --fill:#F2F2F4;
    --label:#000; --label-2:#636366; --label-3:#6E6E73; --line:#E5E5EA; --ctl:#C7C7CC;
    --tint:#0A5BD9; --tint-text:#0A5BD9; --bad-text:#B3261E;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000; --card:#000; --fill:#1C1C1E;
      --label:#fff; --label-2:#A1A1A6; --label-3:#8E8E93; --line:#2C2C2E; --ctl:#48484A;
      --tint:#2468E0; --tint-text:#7DB4FF; --bad-text:#FF8A80;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000; --card:#000; --fill:#1C1C1E;
    --label:#fff; --label-2:#A1A1A6; --label-3:#8E8E93; --line:#2C2C2E; --ctl:#48484A;
    --tint:#2468E0; --tint-text:#7DB4FF; --bad-text:#FF8A80;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100dvh; background:var(--bg); color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 32px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);
    -webkit-font-smoothing:antialiased; touch-action:manipulation; overscroll-behavior-y:none;
  }
  .wrap{width:100%; max-width:380px;}
  .hero{text-align:center; margin-bottom:32px;}
  .hero .mark{width:56px; height:56px; border-radius:14px; margin:0 auto 20px; display:block;}
  .hero .eyebrow{font-size:13px; font-weight:500; color:var(--label-2); margin:0 0 4px;}
  .hero h1{font-size:28px; font-weight:700; letter-spacing:-.03em; margin:0; line-height:1.15;}
  .hero p{margin:8px 0 0; color:var(--label-2); font-size:15px;}
  button{font:inherit; -webkit-user-select:none; user-select:none;}
  .primary{
    width:100%; border:none; border-radius:999px; background:var(--tint); color:#fff;
    font-size:16px; font-weight:600; min-height:48px; padding:10px 20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .primary:disabled{opacity:.5;}
  .primary svg{width:22px; height:22px;}
  .linkish{
    width:100%; border:none; background:none; color:var(--tint-text);
    font-size:15px; font-weight:500; min-height:44px; padding:10px 4px; cursor:pointer; border-radius:999px;
  }
  .divider{display:flex; align-items:center; gap:12px; color:var(--label-2); font-size:13px; margin:16px 0;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}
  .form{display:flex; flex-direction:column; gap:16px; margin-bottom:16px;}
  label{display:block; font-size:13px; font-weight:500; color:var(--label-2); margin:0 0 6px;}
  input{
    width:100%; min-height:48px; padding:0 14px; border:1px solid var(--ctl); background:var(--card); color:var(--label);
    font:inherit; font-size:16px; border-radius:10px; -webkit-appearance:none; appearance:none;
  }
  input:focus{outline:2px solid var(--tint-text); outline-offset:1px;}
  input::placeholder{color:var(--label-3); opacity:1;}
  .status{min-height:1.3em; font-size:15px; color:var(--label-2); text-align:center; margin-top:16px; line-height:1.4;}
  .status.error{color:var(--bad-text);}
  #pwBlock[hidden], [hidden]{display:none !important;}
  .hint{font-size:13px; color:var(--label-2); margin:-8px 2px 16px;}
  .links{display:flex; flex-direction:column; gap:0; margin-top:8px;}
  .back{display:flex; align-items:center; justify-content:center; min-height:44px; margin-top:8px; color:var(--label-2); font-size:13px; text-decoration:none;}
  @media (prefers-reduced-motion: no-preference){
    .primary,.linkish{transition:transform .14s ease, opacity .14s ease, background-color .16s ease;}
    .primary:active{transform:scale(.98);}
  }
</style>
  <!-- Analytics. Serves an inert file unless GA_MEASUREMENT_ID is set on
       the service, so local runs and browser tests send nothing. -->
  <script src="/analytics.js" async></script>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <img class="mark" src="/icon.svg" alt="" width="56" height="56">
      <p class="eyebrow">Trip Planner</p>
      <h1 id="title">Welcome back</h1>
      <p>Research, plan and watch prices in one place.</p>
    </div>

    <button class="primary" id="faceBtn" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9.5v1M15 9.5v1M12 9.5v3.5h-1M9 15.5c.8.8 1.8 1.2 3 1.2s2.2-.4 3-1.2"/></svg>
      Sign in with Face ID
    </button>
    <div class="divider" id="divider" hidden>or</div>

    <div id="pwBlock">
      <div class="form">
        <div class="field" id="nameRow" hidden>
          <label for="n">Your name</label>
          <input id="n" autocomplete="name" enterkeyhint="next" />
        </div>
        <div class="field">
          <label for="u">Email</label>
          <input id="u" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="p">Password</label>
          <input id="p" type="password" autocomplete="current-password" enterkeyhint="go" />
        </div>
      </div>
      <p class="hint" id="pwHint" hidden>At least 10 characters.</p>
      <button class="primary" id="pwBtn">Sign in</button>
    </div>

    <div class="links">
      <button class="linkish" id="showPw" hidden>Use email instead</button>
      <button class="linkish" id="forgot">Forgot your password?</button>
      <button class="linkish" id="toggleMode">Need an account? Create one</button>
    </div>
    <div class="status" id="status"></div>
    <a class="back" href="/">Back to Trip Planner and the example trip</a>
  </div>

<script>
(function(){
  "use strict";
  var statusEl = document.getElementById('status');
  var faceBtn = document.getElementById('faceBtn');
  var divider = document.getElementById('divider');
  var pwBlock = document.getElementById('pwBlock');
  var showPw = document.getElementById('showPw');

  function say(msg, isError){
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (isError ? ' error' : '');
  }
  function go(){ window.location.replace('/'); }

  function b64urlToBuf(str){
    var pad = str.length % 4 ? new Array(5 - (str.length % 4)).join('=') : '';
    var bin = atob(str.replace(/-/g,'+').replace(/_/g,'/') + pad);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  function bufToB64url(buf){
    var bytes = new Uint8Array(buf), str = '';
    for (var i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
    return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  var supported = !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.get);

  // Show the Face ID button only if a passkey actually exists on this domain.
  // Offer Face ID only if some passkey exists for this host; the credential
  // itself identifies which account is signing in.
  fetch('/api/auth/passkey/available').then(function(r){ return r.json(); }).then(function(s){
    if (supported && s.available){
      faceBtn.hidden = false;
      divider.hidden = false;
      pwBlock.hidden = true;
      showPw.hidden = false;
    }
  }).catch(function(){});

  showPw.addEventListener('click', function(){
    pwBlock.hidden = false;
    showPw.hidden = true;
  });

  faceBtn.addEventListener('click', function(){
    say('Waiting for Face ID…');
    faceBtn.disabled = true;
    fetch('/api/auth/passkey/login/options', {method:'POST'})
      .then(function(r){ return r.json().then(function(d){ if (!r.ok) throw new Error(d.error || 'failed'); return d; }); })
      .then(function(options){
        options.challenge = b64urlToBuf(options.challenge);
        (options.allowCredentials || []).forEach(function(c){ c.id = b64urlToBuf(c.id); });
        return navigator.credentials.get({publicKey: options});
      })
      .then(function(cred){
        return fetch('/api/auth/passkey/login/verify', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            id: cred.id,
            rawId: bufToB64url(cred.rawId),
            type: cred.type,
            clientExtensionResults: cred.getClientExtensionResults(),
            response: {
              clientDataJSON: bufToB64url(cred.response.clientDataJSON),
              authenticatorData: bufToB64url(cred.response.authenticatorData),
              signature: bufToB64url(cred.response.signature),
              userHandle: cred.response.userHandle ? bufToB64url(cred.response.userHandle) : undefined
            }
          })
        });
      })
      .then(function(r){ return r.json().then(function(d){ if (!r.ok) throw new Error(d.error || 'failed'); return d; }); })
      .then(go)
      .catch(function(err){
        faceBtn.disabled = false;
        say(err && err.name === 'NotAllowedError' ? 'Cancelled.' : 'Face ID sign-in failed — use your password.', true);
        pwBlock.hidden = false;
        showPw.hidden = true;
      });
  });

  // One form, two modes. Registering is open to anyone; AI features are
  // requested separately from inside the app and approved by hand.
  var registering = false;
  var nameRow = document.getElementById('nameRow');
  var pwHint = document.getElementById('pwHint');
  var pwBtn = document.getElementById('pwBtn');
  var toggleMode = document.getElementById('toggleMode');

  function applyMode(){
    nameRow.hidden = !registering;
    pwHint.hidden = !registering;
    pwBtn.textContent = registering ? 'Create account' : 'Sign in';
    document.getElementById('title').textContent = registering ? 'Create your account' : 'Welcome back';
    toggleMode.textContent = registering
      ? 'Already have an account? Sign in'
      : 'Need an account? Create one';
    document.getElementById('p').setAttribute(
      'autocomplete', registering ? 'new-password' : 'current-password');
    say('');
  }
  toggleMode.addEventListener('click', function(){
    registering = !registering;
    pwBlock.hidden = false;
    showPw.hidden = true;
    applyMode();
  });
  // "Create a free account" on the home page lands here ready to register.
  if (/[?&]new=1\b/.test(location.search)) registering = true;
  applyMode();

  function submitPassword(){
    var u = document.getElementById('u').value.trim();
    var p = document.getElementById('p').value;
    if (!u || !p){ say('Enter your email and password.', true); return; }
    if (registering && p.length < 10){ say('Password must be at least 10 characters.', true); return; }
    say(registering ? 'Creating your account…' : 'Signing in…');
    pwBtn.disabled = true;
    var body = registering
      ? { email:u, password:p, displayName: document.getElementById('n').value.trim() }
      : { email:u, password:p };
    fetch(registering ? '/api/auth/register' : '/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    }).then(function(r){
      return r.json().then(function(d){ if (!r.ok) throw new Error(d.error || 'failed'); return d; });
    }).then(go).catch(function(err){
      pwBtn.disabled = false;
      say((err && err.message) || 'That didn’t work.', true);
    });
  }
  // A reset arrives as an emailed link now. It is handled once for the whole
  // domain at strongtechnicalconsulting.com/reset, because one account covers
  // every app and there should be one page to get right. Nobody has to ask an
  // admin to get back into their own account any more.
  document.getElementById('forgot').addEventListener('click', function(){
    var u = document.getElementById('u').value.trim();
    var to = 'https://www.strongtechnicalconsulting.com/reset';
    // Carry the address across so they do not type it twice.
    if (u) to += '?email=' + encodeURIComponent(u);
    window.location.href = to;
  });

  document.getElementById('pwBtn').addEventListener('click', submitPassword);
  document.getElementById('p').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); submitPassword(); }
  });
})();
</script>
</body>
</html>
